# API and SPA share paths. Only HTML GET/HEAD navigation bypasses the API.
# The existing client always sends Accept: application/json.
map "$request_method:$http_accept" $spa_navigation {
    default 0;
    ~*^(GET|HEAD):.*text/html 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Vary Accept always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(auth|projects)(/|$) {
        # A rewrite-only if is safe; no proxy directives inside the if.
        if ($spa_navigation) { rewrite ^ /index.html last; }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve same-origin redirects from FastAPI's trailing-slash handling.
        proxy_redirect http://backend:8000/ /;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Vary Accept always;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
